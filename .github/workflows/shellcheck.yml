name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: error
          check_together: 'yes'

      - name: bash -n syntax
        run: |
          bash -n update-clean.sh
          bash -n tests/simulate_ubuntu.sh
          bash -n tests/run_simulation.sh

      - name: Simulated Ubuntu/Debian systems
        run: sudo ./tests/simulate_ubuntu.sh